<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人待办与代表项目 (Minimal Todo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .done-line { text-decoration: line-through; opacity: 0.55; }
  </style>
</head>
<body class="bg-[#fafafa] text-slate-800 min-h-screen">

  <div class="max-w-2xl mx-auto px-4 py-10 sm:py-14 space-y-8">
    
    <!-- 极简头部 -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>待办 & 核心项目</span>
          <span id="pendingBadge" class="text-xs px-2 py-0.5 bg-teal-50 text-teal-700 border border-teal-200 rounded-full font-medium">4 项待办</span>
        </h1>
        <p class="text-xs text-slate-500 mt-1 flex flex-wrap items-center gap-x-2 gap-y-1">
          <span>简单、直接、可提醒。</span>
          <span id="syncStatus" class="inline-flex items-center gap-1 text-[11px] text-slate-400">
            <i class="fa-solid fa-hard-drive"></i> 本地模式
          </span>
          <span class="text-slate-300">·</span>
          <span id="lastRefreshTime" class="inline-flex items-center gap-1 text-[11px] text-slate-400">
            <i class="fa-regular fa-clock"></i> 上次刷新: 刚刚
          </span>
        </p>
      </div>
      
      <!-- 云同步与备份操作 -->
      <div class="flex items-center gap-2 text-xs">
        <button onclick="toggleCloudConfig()" id="cloudBtn" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 shadow-sm transition flex items-center gap-1.5" title="配置 Supabase 云同步">
          <i class="fa-solid fa-cloud text-teal-600"></i>
          <span id="cloudBtnText">云同步</span>
        </button>
        <button onclick="exportData()" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 shadow-sm transition" title="导出备份">
          <i class="fa-solid fa-download"></i> 导出
        </button>
        <label class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 shadow-sm transition cursor-pointer" title="导入恢复">
          <i class="fa-solid fa-upload"></i> 导入
          <input type="file" accept=".json" class="hidden" onchange="importData(event)">
        </label>
        <button onclick="handleManualRefresh()" class="px-2 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-500 hover:text-teal-600 shadow-sm transition" title="立即刷新同步">
          <i id="refreshIcon" class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </header>

    <!-- Supabase 云同步配置抽屉/面板 -->
    <div id="cloudPanel" class="hidden rounded-xl bg-slate-100/90 border border-slate-200 p-4 text-xs text-slate-700 space-y-3">
      <div class="flex items-center justify-between font-semibold text-slate-900">
        <span class="flex items-center gap-1.5"><i class="fa-solid fa-cloud text-teal-600"></i> 配置 Supabase 多端实时同步 (手机 & Mac)</span>
        <button onclick="toggleCloudConfig()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-slate-500 leading-relaxed">
        只需填入您 Supabase 项目的 <b>Project URL</b> 和 <b>anon public key</b>。配置一次后，手机与电脑打勾/添加即时同步，不需要手动 pull。
      </p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <input type="text" id="supabaseUrlInput" placeholder="https://xxx.supabase.co"
               class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-teal-500">
        <input type="password" id="supabaseKeyInput" placeholder="eyJhbGciOi..."
               class="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-teal-500">
      </div>
      <div class="flex items-center justify-between pt-1">
        <span id="cloudHint" class="text-[11px] text-slate-400">凭证仅保存在您当前浏览器的本地存储中</span>
        <div class="flex gap-2">
          <button onclick="disconnectCloud()" id="disconnectBtn" class="hidden px-3 py-1 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg hover:bg-rose-100 font-medium">断开</button>
          <button onclick="saveCloudConfig()" class="px-3.5 py-1 bg-teal-600 hover:bg-teal-500 text-white font-medium rounded-lg shadow-sm">连接并同步</button>
        </div>
      </div>
    </div>

    <!-- 超期与到期提醒栏 (有即将到期或逾期时出现) -->
    <div id="alertBox" class="hidden rounded-xl bg-amber-50 border border-amber-200 p-3.5 text-xs text-amber-900 space-y-1.5">
      <div class="font-semibold flex items-center gap-1.5 text-amber-800">
        <i class="fa-solid fa-bell"></i> 到期与临期提醒
      </div>
      <div id="alertItems" class="space-y-1 pl-4 list-disc"></div>
    </div>

    <!-- 极简快速输入框 -->
    <form onsubmit="addTodo(event)" class="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-2">
      <input type="text" id="newTitle" required placeholder="+ 添加待办或项目（如：驾驶照补办、韩国机票...）"
             class="flex-1 px-3 py-2 text-sm bg-transparent focus:outline-none">
      <div class="flex items-center gap-2 justify-end">
        <input type="date" id="newDueDate" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-600 focus:outline-none" title="截止/提醒日期（可选）">
        <button type="submit" class="px-4 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium rounded-lg shadow-sm transition">
          添加
        </button>
      </div>
    </form>

    <!-- 筛选切换 -->
    <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
      <div class="flex items-center gap-1 bg-slate-100 p-0.5 rounded-lg">
        <button onclick="setFilter('ALL')" id="filterAll" class="px-3 py-1 rounded-md bg-white text-slate-800 font-medium shadow-xs">全部</button>
        <button onclick="setFilter('PENDING')" id="filterPending" class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900">未完成</button>
        <button onclick="setFilter('DONE')" id="filterDone" class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900">已办结</button>
      </div>
      <span id="counterText" class="text-xs text-slate-400">共 4 项</span>
    </div>

    <!-- 核心列表 -->
    <div id="todoList" class="space-y-2">
      <!-- 渲染待办项 -->
    </div>

    <div id="emptyNotice" class="hidden text-center py-12 text-slate-400 text-sm">
      <i class="fa-regular fa-circle-check text-3xl mb-2 text-slate-300 block"></i>
      暂无任务，轻松一下
    </div>

  </div>

  <!-- 待办详情与编辑弹窗 Modal -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="p-5 border-b border-slate-100 flex items-start justify-between gap-3">
        <div class="flex items-center gap-2 flex-1 min-w-0">
          <button id="modalToggleDoneBtn" onclick="modalToggleDone()" class="text-xl text-slate-300 hover:text-teal-600 transition flex-shrink-0">
            <i class="fa-regular fa-circle"></i>
          </button>
          <div class="flex-1 min-w-0">
            <input type="text" id="modalTitleInput" class="w-full text-base font-bold text-slate-900 focus:outline-none bg-transparent border-b border-transparent hover:border-slate-200 focus:border-teal-500 transition py-0.5" placeholder="事项名称">
          </div>
        </div>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-5 space-y-4 text-xs">
        <div>
          <label class="block text-slate-400 font-medium mb-1 flex items-center gap-1.5">
            <i class="fa-regular fa-calendar text-teal-600"></i> 截止与提醒日期
          </label>
          <input type="date" id="modalDueDateInput" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-slate-700 text-xs focus:outline-none focus:ring-1 focus:ring-teal-500">
        </div>

        <div>
          <label class="block text-slate-400 font-medium mb-1 flex items-center gap-1.5">
            <i class="fa-regular fa-file-lines text-teal-600"></i> 详细说明与攻略备忘
          </label>
          <textarea id="modalNoteInput" rows="6" placeholder="输入攻略、地址、办理步骤、注意事项等备忘..."
                    class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-slate-800 text-xs leading-relaxed focus:outline-none focus:ring-1 focus:ring-teal-500 resize-y"></textarea>
        </div>
      </div>

      <div class="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
        <button onclick="modalDeleteItem()" class="text-rose-600 hover:text-rose-700 text-xs font-medium flex items-center gap-1 px-2 py-1.5 rounded-lg hover:bg-rose-50 transition">
          <i class="fa-solid fa-trash-can"></i> 删除事项
        </button>
        <div class="flex items-center gap-2">
          <button onclick="closeDetailModal()" class="px-3.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-xs font-medium transition">
            取消
          </button>
          <button onclick="modalSaveItem()" class="px-4 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-xs font-medium shadow-sm transition">
            保存修改
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 初始必要数据（默认包含用户核心生活待办 + 2项核心项目）
    const DEFAULT_DATA = [
      { 
        id: "1", 
        title: "换驾照 (海淀政务服务中心联想桥办公区 · 皂君庙5号)", 
        dueDate: getOffsetDate(1), 
        done: false, 
        note: "明天14:00前往。带身份证原件+旧照；先在12123清违章！现场先去旁边小红楼102室体检拍照(各20)，回主大厅取号：①若未超期/满期，交10元几分钟直接领证；②若超1年注销可恢复，窗口激活拿受理单，1小时后12123约科一(工作日排考，驾考宝典刷专属500题)。" 
      },
      { id: "2", title: "韩国机票", dueDate: getOffsetDate(5), done: false, note: "" },
      { id: "3", title: "碳 13 检查", dueDate: getOffsetDate(1), done: false, note: "空腹受检" },
      { id: "4", title: "零碎资产整理", dueDate: "", done: false, note: "银行卡、零钱通、社保账户核对" },
      { id: "5", title: "核心代表项目：Personal AI OS", dueDate: getOffsetDate(14), done: false, note: "v1.0 架构发布与文档整理" }
    ];

    function getOffsetDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    }

    const DATA_VERSION = "2026-09-17-v5";
    const KEY = "minimal_todo_data";
    const VERSION_KEY = "minimal_todo_version";
    const SUPABASE_CONFIG_KEY = "minimal_todo_supabase_config";
    let items = [];
    let currentFilter = 'ALL';
    let supabaseClient = null;
    let realtimeChannel = null;
    let lastRefreshTimestamp = Date.now();

    function formatTime(date) {
      const d = date || new Date();
      const pad = n => String(n).padStart(2, '0');
      const month = pad(d.getMonth() + 1);
      const day = pad(d.getDate());
      const hours = pad(d.getHours());
      const mins = pad(d.getMinutes());
      const secs = pad(d.getSeconds());
      return `${month}-${day} ${hours}:${mins}:${secs}`;
    }

    function recordRefresh() {
      lastRefreshTimestamp = Date.now();
      updateRefreshTimeDisplay();
    }

    function updateRefreshTimeDisplay() {
      const el = document.getElementById('lastRefreshTime');
      if (!el) return;
      const d = new Date(lastRefreshTimestamp);
      el.innerHTML = `<i class="fa-regular fa-clock text-teal-600"></i> 上次刷新: ${formatTime(d)}`;
    }

    function init() {
      // 检查版本，如果发现新版本且用户未连接 Supabase，自动加载新默认列表
      const currentVersion = localStorage.getItem(VERSION_KEY);
      const saved = localStorage.getItem(KEY);

      if (!saved || currentVersion !== DATA_VERSION) {
        items = DEFAULT_DATA;
        saveLocal();
        localStorage.setItem(VERSION_KEY, DATA_VERSION);
      } else {
        try { items = JSON.parse(saved); } catch(e) { items = DEFAULT_DATA; }
      }
      recordRefresh();
      render();

      // 2. 检查并初始化 Supabase 云端同步
      initSupabase();
    }

    async function handleManualRefresh() {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('fa-spin');

      if (supabaseClient) {
        await pullFromCloud();
      } else {
        // 本地模式重新读盘
        const saved = localStorage.getItem(KEY);
        if (saved) {
          try { items = JSON.parse(saved); } catch(e) {}
        }
      }
      recordRefresh();
      render();

      setTimeout(() => {
        if (icon) icon.classList.remove('fa-spin');
      }, 500);
    }

    function resetDefaultData() {
      if (confirm("是否重置并加载最新的官方待办推荐与攻略？")) {
        items = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveLocal();
        localStorage.setItem(VERSION_KEY, DATA_VERSION);
        if (supabaseClient) pushAllToCloud();
        recordRefresh();
        render();
      }
    }

    function initSupabase() {
      const cfgRaw = localStorage.getItem(SUPABASE_CONFIG_KEY);
      if (!cfgRaw) {
        updateSyncBadge(false);
        return;
      }

      try {
        const { url, key } = JSON.parse(cfgRaw);
        if (!url || !key || !window.supabase) {
          updateSyncBadge(false);
          return;
        }

        document.getElementById('supabaseUrlInput').value = url;
        document.getElementById('supabaseKeyInput').value = key;
        document.getElementById('disconnectBtn').classList.remove('hidden');

        supabaseClient = window.supabase.createClient(url, key);
        updateSyncBadge(true, "连接中...");

        // 从云端拉取最新数据
        pullFromCloud();

        // 建立 Realtime 实时监听
        setupRealtime();
      } catch (e) {
        console.error("Supabase init error:", e);
        updateSyncBadge(false);
      }
    }

    async function pullFromCloud() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('todos')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (data && data.length > 0) {
          // 云端有数据，合并并以云端最新为准
          items = data.map(d => ({
            id: String(d.id),
            title: d.title,
            dueDate: d.due_date || "",
            done: !!d.done,
            note: d.note || ""
          }));
          saveLocal();
          recordRefresh();
          render();
          updateSyncBadge(true, "已实时云同步");
        } else if (items.length > 0) {
          // 云端表是空的，把本地的初始待办推上去初始化
          await pushAllToCloud();
          updateSyncBadge(true, "已实时云同步");
        }
      } catch (err) {
        console.warn("Pull from cloud error:", err.message);
        updateSyncBadge(true, "云端连接异常");
      }
    }

    async function pushAllToCloud() {
      if (!supabaseClient) return;
      try {
        const rows = items.map(item => ({
          id: item.id,
          title: item.title,
          due_date: item.dueDate || null,
          done: !!item.done,
          note: item.note || ""
        }));
        await supabaseClient.from('todos').upsert(rows);
      } catch (e) {
        console.error("pushAllToCloud error:", e);
      }
    }

    function setupRealtime() {
      if (!supabaseClient) return;
      try {
        if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel = supabaseClient.channel('todos-realtime')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, payload => {
            // 当其他端（例如手机或电脑）有变动时触发
            if (payload.eventType === 'INSERT') {
              const d = payload.new;
              if (!items.find(i => String(i.id) === String(d.id))) {
                items.unshift({ id: String(d.id), title: d.title, dueDate: d.due_date || "", done: !!d.done, note: d.note || "" });
                saveLocal();
                recordRefresh();
                render();
              }
            } else if (payload.eventType === 'UPDATE') {
              const d = payload.new;
              const idx = items.findIndex(i => String(i.id) === String(d.id));
              if (idx !== -1) {
                items[idx] = { id: String(d.id), title: d.title, dueDate: d.due_date || "", done: !!d.done, note: d.note || "" };
                saveLocal();
                recordRefresh();
                render();
              }
            } else if (payload.eventType === 'DELETE') {
              items = items.filter(i => String(i.id) !== String(payload.old.id));
              saveLocal();
              recordRefresh();
              render();
            }
          })
          .subscribe();
      } catch (e) {
        console.error("Realtime subscription error:", e);
      }
    }

    function updateSyncBadge(isConnected, msg) {
      const el = document.getElementById('syncStatus');
      const btnText = document.getElementById('cloudBtnText');
      if (isConnected) {
        el.innerHTML = `<span class="inline-flex items-center gap-1 text-[11px] text-teal-600 font-medium"><i class="fa-solid fa-cloud-bolt text-teal-500"></i> ${msg || '云端已连接'}</span>`;
        btnText.innerText = "云已连";
      } else {
        el.innerHTML = `<span class="inline-flex items-center gap-1 text-[11px] text-slate-400"><i class="fa-solid fa-hard-drive"></i> 本地模式</span>`;
        btnText.innerText = "云同步";
      }
    }

    function toggleCloudConfig() {
      const panel = document.getElementById('cloudPanel');
      panel.classList.toggle('hidden');
    }

    async function saveCloudConfig() {
      const url = document.getElementById('supabaseUrlInput').value.trim();
      const key = document.getElementById('supabaseKeyInput').value.trim();
      if (!url || !key) {
        alert("请输入 Supabase 的 Project URL 和 Anon Key");
        return;
      }

      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({ url, key }));
      document.getElementById('cloudPanel').classList.add('hidden');
      initSupabase();
    }

    function disconnectCloud() {
      if (confirm("确定断开与 Supabase 的云同步吗？（本地数据会保留）")) {
        localStorage.removeItem(SUPABASE_CONFIG_KEY);
        if (realtimeChannel && supabaseClient) {
          supabaseClient.removeChannel(realtimeChannel);
        }
        supabaseClient = null;
        document.getElementById('supabaseUrlInput').value = '';
        document.getElementById('supabaseKeyInput').value = '';
        document.getElementById('disconnectBtn').classList.add('hidden');
        document.getElementById('cloudPanel').classList.add('hidden');
        updateSyncBadge(false);
      }
    }

    function saveLocal() {
      localStorage.setItem(KEY, JSON.stringify(items));
    }

    async function syncItemUpsert(item) {
      saveLocal();
      if (supabaseClient) {
        try {
          await supabaseClient.from('todos').upsert({
            id: item.id,
            title: item.title,
            due_date: item.dueDate || null,
            done: !!item.done,
            note: item.note || ""
          });
        } catch (e) {
          console.error("Cloud upsert error:", e);
        }
      }
    }

    async function syncItemDelete(id) {
      saveLocal();
      if (supabaseClient) {
        try {
          await supabaseClient.from('todos').delete().eq('id', id);
        } catch (e) {
          console.error("Cloud delete error:", e);
        }
      }
    }

    function render() {
      const listEl = document.getElementById('todoList');
      const emptyEl = document.getElementById('emptyNotice');
      const alertBox = document.getElementById('alertBox');
      const alertItems = document.getElementById('alertItems');

      const today = new Date().toISOString().split('T')[0];

      // 提醒计算
      const alerts = [];
      const pendingItems = items.filter(i => !i.done);
      document.getElementById('pendingBadge').innerText = `${pendingItems.length} 项待办`;
      document.getElementById('counterText').innerText = `共 ${items.length} 项`;

      pendingItems.forEach(item => {
        if (!item.dueDate) return;
        if (item.dueDate < today) {
          alerts.push(`<div class="text-rose-700 font-medium">⚠️ <b>${escapeHtml(item.title)}</b>：已逾期 (原定 ${item.dueDate})</div>`);
        } else if (item.dueDate === today) {
          alerts.push(`<div class="text-amber-800 font-medium">⏰ <b>${escapeHtml(item.title)}</b>：今天到期！</div>`);
        } else {
          const diff = Math.ceil((new Date(item.dueDate) - new Date(today)) / (86400000));
          if (diff <= 3) {
            alerts.push(`<div>⏳ <b>${escapeHtml(item.title)}</b>：距到期仅剩 ${diff} 天 (${item.dueDate})</div>`);
          }
        }
      });

      if (alerts.length > 0) {
        alertBox.classList.remove('hidden');
        alertItems.innerHTML = alerts.join('');
      } else {
        alertBox.classList.add('hidden');
      }

      // 筛选
      const filtered = items.filter(i => {
        if (currentFilter === 'PENDING') return !i.done;
        if (currentFilter === 'DONE') return i.done;
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      listEl.innerHTML = filtered.map(item => {
        const isOverdue = !item.done && item.dueDate && item.dueDate < today;
        const isToday = !item.done && item.dueDate && item.dueDate === today;

        let dateTag = '';
        if (item.dueDate) {
          if (item.done) {
            dateTag = `<span class="text-[11px] text-slate-400"><i class="fa-regular fa-calendar-check mr-1"></i>${item.dueDate}</span>`;
          } else if (isOverdue) {
            dateTag = `<span class="text-[11px] font-semibold text-rose-600 bg-rose-50 border border-rose-200 px-1.5 py-0.5 rounded"><i class="fa-solid fa-triangle-exclamation mr-1"></i>已逾期 ${item.dueDate}</span>`;
          } else if (isToday) {
            dateTag = `<span class="text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded"><i class="fa-regular fa-bell mr-1"></i>今天截止</span>`;
          } else {
            dateTag = `<span class="text-[11px] text-slate-500"><i class="fa-regular fa-calendar mr-1"></i>${item.dueDate}</span>`;
          }
        }

        return `
          <div class="group bg-white p-3.5 rounded-xl border border-slate-200/90 shadow-xs flex items-center justify-between gap-3 hover:border-slate-300 hover:shadow-sm transition cursor-pointer" onclick="openDetailModal('${item.id}', event)">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <button onclick="event.stopPropagation(); toggleDone('${item.id}')" class="text-base text-slate-300 hover:text-teal-600 transition flex-shrink-0" title="${item.done ? '标记为未完成' : '标记为已完成'}">
                ${item.done ? '<i class="fa-solid fa-circle-check text-teal-600"></i>' : '<i class="fa-regular fa-circle"></i>'}
              </button>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium ${item.done ? 'done-line text-slate-400' : 'text-slate-800'} truncate">
                  ${escapeHtml(item.title)}
                </div>
                ${item.note ? `<p class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(item.note)}</p>` : ''}
              </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0" onclick="event.stopPropagation()">
              ${dateTag}
              <button onclick="openDetailModal('${item.id}')" class="text-slate-300 hover:text-slate-600 opacity-0 group-hover:opacity-100 p-1 text-xs transition" title="查看详情与备注">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteItem('${item.id}')" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 p-1 text-xs transition" title="删除">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function addTodo(e) {
      e.preventDefault();
      const input = document.getElementById('newTitle');
      const dateInput = document.getElementById('newDueDate');
      const title = input.value.trim();
      if (!title) return;

      const newItem = {
        id: String(Date.now()),
        title: title,
        dueDate: dateInput.value || "",
        done: false,
        note: ""
      };

      items.unshift(newItem);
      input.value = "";
      dateInput.value = "";
      syncItemUpsert(newItem);
      render();
    }

    let editingItemId = null;

    function openDetailModal(id, event) {
      if (event && event.target && (event.target.tagName === 'BUTTON' || event.target.closest('button'))) return;
      const item = items.find(i => i.id === id);
      if (!item) return;

      editingItemId = id;
      document.getElementById('modalTitleInput').value = item.title || "";
      document.getElementById('modalDueDateInput').value = item.dueDate || "";
      document.getElementById('modalNoteInput').value = item.note || "";

      updateModalDoneButton(item.done);
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
      editingItemId = null;
    }

    function updateModalDoneButton(isDone) {
      const btn = document.getElementById('modalToggleDoneBtn');
      if (!btn) return;
      btn.innerHTML = isDone ? '<i class="fa-solid fa-circle-check text-teal-600"></i>' : '<i class="fa-regular fa-circle"></i>';
      btn.title = isDone ? "点击标记为未完成" : "点击标记为已完成";
    }

    function modalToggleDone() {
      if (!editingItemId) return;
      const item = items.find(i => i.id === editingItemId);
      if (!item) return;
      item.done = !item.done;
      updateModalDoneButton(item.done);
      syncItemUpsert(item);
      render();
    }

    function modalSaveItem() {
      if (!editingItemId) return;
      const item = items.find(i => i.id === editingItemId);
      if (!item) return;

      const newTitle = document.getElementById('modalTitleInput').value.trim();
      const newDueDate = document.getElementById('modalDueDateInput').value;
      const newNote = document.getElementById('modalNoteInput').value.trim();

      if (!newTitle) {
        alert("事项名称不能为空");
        return;
      }

      item.title = newTitle;
      item.dueDate = newDueDate;
      item.note = newNote;

      syncItemUpsert(item);
      render();
      closeDetailModal();
    }

    function modalDeleteItem() {
      if (!editingItemId) return;
      if (confirm("确定要删除此待办事项吗？")) {
        const idToDelete = editingItemId;
        closeDetailModal();
        deleteItem(idToDelete);
      }
    }

    // 支持 ESC 键关闭详情弹窗
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('detailModal').classList.contains('hidden')) {
        closeDetailModal();
      }
    });

    function toggleDone(id) {
      const target = items.find(i => i.id === id);
      if (target) {
        target.done = !target.done;
        syncItemUpsert(target);
        render();
      }
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      syncItemDelete(id);
      render();
    }

    function editNote(id) {
      const target = items.find(i => i.id === id);
      if (!target) return;
      const newTitle = prompt("修改事项名称：", target.title);
      if (newTitle === null) return;
      const newNote = prompt("添加/修改备忘说明：", target.note || "");
      if (newNote === null) return;
      
      target.title = newTitle.trim() || target.title;
      target.note = newNote.trim();
      syncItemUpsert(target);
      render();
    }

    function setFilter(type) {
      currentFilter = type;
      ['All', 'Pending', 'Done'].forEach(t => {
        const btn = document.getElementById('filter' + t);
        if (t.toUpperCase() === type) {
          btn.className = "px-3 py-1 rounded-md bg-white text-slate-800 font-medium shadow-xs";
        } else {
          btn.className = "px-3 py-1 rounded-md text-slate-600 hover:text-slate-900";
        }
      });
      render();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `todo_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            items = parsed;
            save();
            render();
          }
        } catch(err) {
          alert("文件解析失败");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      init();
      // 页面从后台唤醒或重新切回时自动刷新时间显示并拉取最新状态
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          handleManualRefresh();
        }
      });
    });
  </script>
</body>
</html>
