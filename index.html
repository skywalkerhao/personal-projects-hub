<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人待办与代表项目 (Minimal Todo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .done-line { text-decoration: line-through; opacity: 0.55; }
  </style>
</head>
<body class="bg-[#fafafa] text-slate-800 min-h-screen">

  <div class="max-w-2xl mx-auto px-4 py-10 sm:py-14 space-y-8">
    
    <!-- 极简头部 -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-200">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <span>待办 & 核心项目</span>
          <span id="pendingBadge" class="text-xs px-2 py-0.5 bg-teal-50 text-teal-700 border border-teal-200 rounded-full font-medium">4 项待办</span>
        </h1>
        <p class="text-xs text-slate-500 mt-1">简单、直接、可提醒。数据自动保存在本地。</p>
      </div>
      
      <!-- 备份操作 -->
      <div class="flex items-center gap-2 text-xs">
        <button onclick="exportData()" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 shadow-sm transition" title="导出备份">
          <i class="fa-solid fa-download"></i> 导出
        </button>
        <label class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 shadow-sm transition cursor-pointer" title="导入恢复">
          <i class="fa-solid fa-upload"></i> 导入
          <input type="file" accept=".json" class="hidden" onchange="importData(event)">
        </label>
      </div>
    </header>

    <!-- 超期与到期提醒栏 (有即将到期或逾期时出现) -->
    <div id="alertBox" class="hidden rounded-xl bg-amber-50 border border-amber-200 p-3.5 text-xs text-amber-900 space-y-1.5">
      <div class="font-semibold flex items-center gap-1.5 text-amber-800">
        <i class="fa-solid fa-bell"></i> 到期与临期提醒
      </div>
      <div id="alertItems" class="space-y-1 pl-4 list-disc"></div>
    </div>

    <!-- 极简快速输入框 -->
    <form onsubmit="addTodo(event)" class="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-2">
      <input type="text" id="newTitle" required placeholder="+ 添加待办或项目（如：驾驶照补办、韩国机票...）"
             class="flex-1 px-3 py-2 text-sm bg-transparent focus:outline-none">
      <div class="flex items-center gap-2 justify-end">
        <input type="date" id="newDueDate" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-600 focus:outline-none" title="截止/提醒日期（可选）">
        <button type="submit" class="px-4 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium rounded-lg shadow-sm transition">
          添加
        </button>
      </div>
    </form>

    <!-- 筛选切换 -->
    <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
      <div class="flex items-center gap-1 bg-slate-100 p-0.5 rounded-lg">
        <button onclick="setFilter('ALL')" id="filterAll" class="px-3 py-1 rounded-md bg-white text-slate-800 font-medium shadow-xs">全部</button>
        <button onclick="setFilter('PENDING')" id="filterPending" class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900">未完成</button>
        <button onclick="setFilter('DONE')" id="filterDone" class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900">已办结</button>
      </div>
      <span id="counterText" class="text-xs text-slate-400">共 4 项</span>
    </div>

    <!-- 核心列表 -->
    <div id="todoList" class="space-y-2">
      <!-- 渲染待办项 -->
    </div>

    <div id="emptyNotice" class="hidden text-center py-12 text-slate-400 text-sm">
      <i class="fa-regular fa-circle-check text-3xl mb-2 text-slate-300 block"></i>
      暂无任务，轻松一下
    </div>

  </div>

  <script>
    // 初始必要数据（默认包含用户刚提的4项生活待办 + 2项核心项目）
    const DEFAULT_DATA = [
      { id: "1", title: "驾驶照补办", dueDate: getOffsetDate(2), done: false, note: "" },
      { id: "2", title: "韩国机票", dueDate: getOffsetDate(5), done: false, note: "" },
      { id: "3", title: "碳 13 检查", dueDate: getOffsetDate(1), done: false, note: "空腹受检" },
      { id: "4", title: "零碎资产整理", dueDate: "", done: false, note: "银行卡、零钱通、社保账户核对" },
      { id: "5", title: "核心代表项目：Personal AI OS", dueDate: getOffsetDate(14), done: false, note: "v1.0 架构发布与文档整理" }
    ];

    function getOffsetDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    }

    const KEY = "minimal_todo_data";
    let items = [];
    let currentFilter = 'ALL';

    function init() {
      const saved = localStorage.getItem(KEY);
      if (saved) {
        try { items = JSON.parse(saved); } catch(e) { items = DEFAULT_DATA; }
      } else {
        items = DEFAULT_DATA;
        save();
      }
      render();
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(items));
    }

    function render() {
      const listEl = document.getElementById('todoList');
      const emptyEl = document.getElementById('emptyNotice');
      const alertBox = document.getElementById('alertBox');
      const alertItems = document.getElementById('alertItems');

      const today = new Date().toISOString().split('T')[0];

      // 提醒计算
      const alerts = [];
      const pendingItems = items.filter(i => !i.done);
      document.getElementById('pendingBadge').innerText = `${pendingItems.length} 项待办`;
      document.getElementById('counterText').innerText = `共 ${items.length} 项`;

      pendingItems.forEach(item => {
        if (!item.dueDate) return;
        if (item.dueDate < today) {
          alerts.push(`<div class="text-rose-700 font-medium">⚠️ <b>${escapeHtml(item.title)}</b>：已逾期 (原定 ${item.dueDate})</div>`);
        } else if (item.dueDate === today) {
          alerts.push(`<div class="text-amber-800 font-medium">⏰ <b>${escapeHtml(item.title)}</b>：今天到期！</div>`);
        } else {
          const diff = Math.ceil((new Date(item.dueDate) - new Date(today)) / (86400000));
          if (diff <= 3) {
            alerts.push(`<div>⏳ <b>${escapeHtml(item.title)}</b>：距到期仅剩 ${diff} 天 (${item.dueDate})</div>`);
          }
        }
      });

      if (alerts.length > 0) {
        alertBox.classList.remove('hidden');
        alertItems.innerHTML = alerts.join('');
      } else {
        alertBox.classList.add('hidden');
      }

      // 筛选
      const filtered = items.filter(i => {
        if (currentFilter === 'PENDING') return !i.done;
        if (currentFilter === 'DONE') return i.done;
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      listEl.innerHTML = filtered.map(item => {
        const isOverdue = !item.done && item.dueDate && item.dueDate < today;
        const isToday = !item.done && item.dueDate && item.dueDate === today;

        let dateTag = '';
        if (item.dueDate) {
          if (item.done) {
            dateTag = `<span class="text-[11px] text-slate-400"><i class="fa-regular fa-calendar-check mr-1"></i>${item.dueDate}</span>`;
          } else if (isOverdue) {
            dateTag = `<span class="text-[11px] font-semibold text-rose-600 bg-rose-50 border border-rose-200 px-1.5 py-0.5 rounded"><i class="fa-solid fa-triangle-exclamation mr-1"></i>已逾期 ${item.dueDate}</span>`;
          } else if (isToday) {
            dateTag = `<span class="text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded"><i class="fa-regular fa-bell mr-1"></i>今天截止</span>`;
          } else {
            dateTag = `<span class="text-[11px] text-slate-500"><i class="fa-regular fa-calendar mr-1"></i>${item.dueDate}</span>`;
          }
        }

        return `
          <div class="group bg-white p-3 rounded-xl border border-slate-200/90 shadow-xs flex items-center justify-between gap-3 hover:border-slate-300 transition">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <button onclick="toggleDone('${item.id}')" class="text-base text-slate-300 hover:text-teal-600 transition flex-shrink-0">
                ${item.done ? '<i class="fa-solid fa-circle-check text-teal-600"></i>' : '<i class="fa-regular fa-circle"></i>'}
              </button>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium ${item.done ? 'done-line text-slate-400' : 'text-slate-800'} truncate">
                  ${escapeHtml(item.title)}
                </div>
                ${item.note ? `<p class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(item.note)}</p>` : ''}
              </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
              ${dateTag}
              <button onclick="editNote('${item.id}')" class="text-slate-300 hover:text-slate-600 opacity-0 group-hover:opacity-100 p-1 text-xs transition" title="备注/修改">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteItem('${item.id}')" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 p-1 text-xs transition" title="删除">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function addTodo(e) {
      e.preventDefault();
      const input = document.getElementById('newTitle');
      const dateInput = document.getElementById('newDueDate');
      const title = input.value.trim();
      if (!title) return;

      items.unshift({
        id: String(Date.now()),
        title: title,
        dueDate: dateInput.value || "",
        done: false,
        note: ""
      });

      input.value = "";
      dateInput.value = "";
      save();
      render();
    }

    function toggleDone(id) {
      const target = items.find(i => i.id === id);
      if (target) {
        target.done = !target.done;
        save();
        render();
      }
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      save();
      render();
    }

    function editNote(id) {
      const target = items.find(i => i.id === id);
      if (!target) return;
      const newTitle = prompt("修改事项名称：", target.title);
      if (newTitle === null) return;
      const newNote = prompt("添加/修改备忘说明：", target.note || "");
      if (newNote === null) return;
      
      target.title = newTitle.trim() || target.title;
      target.note = newNote.trim();
      save();
      render();
    }

    function setFilter(type) {
      currentFilter = type;
      ['All', 'Pending', 'Done'].forEach(t => {
        const btn = document.getElementById('filter' + t);
        if (t.toUpperCase() === type) {
          btn.className = "px-3 py-1 rounded-md bg-white text-slate-800 font-medium shadow-xs";
        } else {
          btn.className = "px-3 py-1 rounded-md text-slate-600 hover:text-slate-900";
        }
      });
      render();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `todo_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            items = parsed;
            save();
            render();
          }
        } catch(err) {
          alert("文件解析失败");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
